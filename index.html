<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Relativity Spacetime Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid #444;
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            user-select: none;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }
        .slider-container { margin-bottom: 15px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9em; margin-bottom: 5px; color: #aaa; }
        input[type=range] { width: 100%; accent-color: #00d2ff; cursor: pointer; }
        button {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .instruction { font-size: 0.8em; color: #888; margin-top: 15px; line-height: 1.4; }
        
        /* Custom scrollbar for instructions if needed */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h2 class="text-xl font-bold mb-4 text-cyan-400">Spacetime Visualizer</h2>
        
        <div class="slider-container">
            <div class="slider-label"><span>Mass (Gravity Strength)</span><span id="mass-val">1.0</span></div>
            <input type="range" id="mass-slider" min="0.1" max="5.0" step="0.1" value="1.5">
        </div>

        <div class="slider-container">
            <div class="slider-label"><span>Time Speed</span><span id="speed-val">1.0</span></div>
            <input type="range" id="speed-slider" min="0" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="toggle-row">
            <span class="text-sm text-gray-300">Follow Mouse</span>
            <input type="checkbox" id="follow-mouse" checked class="accent-cyan-400 w-5 h-5">
        </div>

        <div class="toggle-row">
            <span class="text-sm text-gray-300">Show Grid Vertices</span>
            <input type="checkbox" id="show-points" class="accent-cyan-400 w-5 h-5">
        </div>

        <button id="reset-particles">Reset Particles</button>
        <button id="toggle-blackhole" style="background: linear-gradient(45deg, #ff4b1f, #ff9068);">Toggle Black Hole Mode</button>

        <div class="instruction">
            <p>• <strong>Shift + Click</strong> anywhere to launch a planet.</p>
            <p>• The grid represents the curvature of spacetime caused by mass.</p>
            <p>• Objects follow straight lines in curved space (geodesics).</p>
        </div>
    </div>

    <!-- Import Three.js as an ES Module -->
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        // --- Configuration ---
        const config = {
            gridSize: 120,
            gridSegments: 80,
            mass: 1.5,
            timeScale: 1.0,
            isBlackHole: false,
            followMouse: true
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.0025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 80);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent going under the grid

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        scene.add(pointLight);

        // --- Spacetime Grid (The "Rubber Sheet") ---
        // We use a high segment plane to allow for smooth deformation
        const planeGeo = new THREE.PlaneGeometry(config.gridSize, config.gridSize, config.gridSegments, config.gridSegments);
        
        // Store original positions to calculate deformation from
        const originalPositions = [];
        const posAttribute = planeGeo.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            originalPositions.push({
                x: posAttribute.getX(i),
                y: posAttribute.getY(i),
                z: posAttribute.getZ(i)
            });
        }

        // Grid Material
        const planeMat = new THREE.MeshBasicMaterial({ 
            color: 0x00d2ff, 
            wireframe: true,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide
        });
        const spacetimeMesh = new THREE.Mesh(planeGeo, planeMat);
        spacetimeMesh.rotation.x = -Math.PI / 2; // Lay flat
        scene.add(spacetimeMesh);

        // Optional Points Material (for vertices)
        const pointsMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.2 });
        const spacetimePoints = new THREE.Points(planeGeo, pointsMat);
        spacetimePoints.rotation.x = -Math.PI / 2;
        spacetimePoints.visible = false;
        scene.add(spacetimePoints);

        // --- The Massive Object (Sun/Black Hole) ---
        const massGeo = new THREE.SphereGeometry(2, 32, 32);
        const massMat = new THREE.MeshStandardMaterial({ 
            color: 0xffff00, 
            emissive: 0xffaa00,
            emissiveIntensity: 2
        });
        const centralMass = new THREE.Mesh(massGeo, massMat);
        scene.add(centralMass);

        // Glow Effect for Mass
        const spriteMaterial = new THREE.SpriteMaterial({ 
            map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/glow.png'), 
            color: 0xffaa00, 
            transparent: true, 
            blending: THREE.AdditiveBlending 
        });
        const glowSprite = new THREE.Sprite(spriteMaterial);
        glowSprite.scale.set(15, 15, 1);
        centralMass.add(glowSprite);

        // --- Particles (Planets/Test Masses) ---
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const particleMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const trailMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });

        class Particle {
            constructor(x, z, vx, vz) {
                this.mesh = new THREE.Mesh(particleGeo, particleMat.clone());
                this.mesh.material.color.setHSL(Math.random(), 1, 0.7);
                this.mesh.position.set(x, 0, z);
                scene.add(this.mesh);

                this.velocity = new THREE.Vector3(vx, 0, vz);
                this.isDead = false;
                
                // Trail
                this.trailGeo = new THREE.BufferGeometry();
                this.trailPositions = new Float32Array(50 * 3); // 50 history points
                this.trailGeo.setAttribute('position', new THREE.BufferAttribute(this.trailPositions, 3));
                this.trailLine = new THREE.Line(this.trailGeo, trailMat);
                this.trailLine.frustumCulled = false;
                scene.add(this.trailLine);
                this.history = [];
            }

            update(dt, massPos, massStrength) {
                if (this.isDead) return;

                // Physics: Integration
                // We simulate gravity by calculating the slope of the potential well
                // F = G * M / r^2 (Newtonian approximation acting as the "slope")
                
                const dx = massPos.x - this.mesh.position.x;
                const dz = massPos.z - this.mesh.position.z;
                const distSq = dx*dx + dz*dz;
                const dist = Math.sqrt(distSq);

                // Gravity Force
                // For the "Black Hole" effect, we increase the power slightly or just mass
                const G = 50; 
                const forceMagnitude = (G * massStrength) / (distSq + 1); // +1 prevents infinity

                const fx = forceMagnitude * (dx / dist);
                const fz = forceMagnitude * (dz / dist);

                this.velocity.x += fx * dt;
                this.velocity.z += fz * dt;

                // Update Position
                this.mesh.position.x += this.velocity.x * dt;
                this.mesh.position.z += this.velocity.z * dt;

                // Update Height (Y) based on spacetime curvature at this X,Z
                this.mesh.position.y = getSpacetimeDepth(this.mesh.position.x, this.mesh.position.z, massPos) + 0.4;

                // Event Horizon / Collision
                if (dist < (config.isBlackHole ? 3 : 2.5)) {
                    this.kill();
                }

                // Boundary Check (Despawn if too far)
                if (dist > 150) this.kill();

                // Update Trail
                this.history.push(this.mesh.position.clone());
                if(this.history.length > 50) this.history.shift();
                
                const positions = this.trailLine.geometry.attributes.position.array;
                let j = 0;
                for(let i=0; i<this.history.length; i++) {
                    positions[j++] = this.history[i].x;
                    positions[j++] = this.history[i].y;
                    positions[j++] = this.history[i].z;
                }
                this.trailLine.geometry.attributes.position.needsUpdate = true;
            }

            kill() {
                this.isDead = true;
                scene.remove(this.mesh);
                scene.remove(this.trailLine);
            }
        }

        // Initialize some particles
        function spawnParticles() {
            // clear old
            particles.forEach(p => p.kill());
            particles.length = 0;

            // Spawn grid of particles with orbital velocity
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 25 + Math.random() * 5;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                // Orbital velocity calculation v = sqrt(GM/r)
                // Tangent vector
                const tx = -Math.sin(angle);
                const tz = Math.cos(angle);
                const vMag = Math.sqrt((50 * config.mass) / radius) * 1.0; // Slightly faster for stability

                particles.push(new Particle(x, z, tx * vMag, tz * vMag));
            }
        }

        spawnParticles();

        // --- Helper: Calculate Spacetime Depression ---
        function getSpacetimeDepth(x, z, center) {
            const dx = x - center.x;
            const dz = z - center.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            
            // The formula for the "funnel": -M / dist
            // We use a "softening" parameter to avoid infinite depth
            const softening = config.isBlackHole ? 0.5 : 2.0;
            const multiplier = config.isBlackHole ? -15 : -10;
            
            return (multiplier * config.mass) / (dist + softening);
        }

        // --- Main Update Loop ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const planeTarget = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // Infinite plane for raycasting
        let targetMassPos = new THREE.Vector3(0, 0, 0);

        function updateSpacetime() {
            // Smoothly move central mass to target
            centralMass.position.lerp(targetMassPos, 0.1);
            
            // Move light source with mass
            pointLight.position.copy(centralMass.position);
            pointLight.position.y += 10;

            const posAttr = planeGeo.attributes.position;
            const currentMassPos = centralMass.position;

            // Deform Grid
            for (let i = 0; i < posAttr.count; i++) {
                const ox = originalPositions[i].x; // Original grid coordinates (local)
                const oy = originalPositions[i].y; // This is Y in geometry, but maps to Z in world space due to rotation
                // Note: PlaneGeometry creates X, Y. We rotated it -90 deg X.
                // So: Geo X -> World X. Geo Y -> World Z. Geo Z -> World Y (height).

                // Transform local vertex to world to measure distance
                // The mesh is at 0,0,0. 
                const worldX = ox;
                const worldZ = -oy; // Because of rotation

                const depth = getSpacetimeDepth(worldX, worldZ, currentMassPos);

                // Set the new Z (which visualizes as Y/Height)
                posAttr.setZ(i, depth);
            }
            posAttr.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = 0.016 * config.timeScale;

            updateSpacetime();

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt, centralMass.position, config.mass);
                if (particles[i].isDead) {
                    particles.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Input Handling ---
        
        // Mouse Tracking
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (config.followMouse) {
                raycaster.setFromCamera(mouse, camera);
                const target = new THREE.Vector3();
                raycaster.ray.intersectPlane(planeTarget, target);
                if (target) {
                    // clamp to grid area
                    target.x = Math.max(-50, Math.min(50, target.x));
                    target.z = Math.max(-50, Math.min(50, target.z));
                    targetMassPos.set(target.x, 0, target.z);
                }
            }
        });

        // Click to Spawn
        window.addEventListener('click', (event) => {
            if (event.shiftKey) {
                raycaster.setFromCamera(mouse, camera);
                const target = new THREE.Vector3();
                raycaster.ray.intersectPlane(planeTarget, target);
                
                if (target) {
                    // Calculate velocity perpendicular to mass for orbit
                    const dx = target.x - centralMass.position.x;
                    const dz = target.z - centralMass.position.z;
                    const angle = Math.atan2(dz, dx);
                    
                    // Spawn with tangential velocity
                    const vMag = Math.sqrt((40 * config.mass) / Math.sqrt(dx*dx+dz*dz));
                    const vx = -Math.sin(angle) * vMag;
                    const vz = Math.cos(angle) * vMag;
                    
                    particles.push(new Particle(target.x, target.z, vx, vz));
                }
            }
        });

        // UI Listeners
        document.getElementById('mass-slider').addEventListener('input', (e) => {
            config.mass = parseFloat(e.target.value);
            document.getElementById('mass-val').textContent = config.mass.toFixed(1);
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            config.timeScale = parseFloat(e.target.value);
            document.getElementById('speed-val').textContent = config.timeScale.toFixed(1);
        });

        document.getElementById('follow-mouse').addEventListener('change', (e) => {
            config.followMouse = e.target.checked;
            if(!config.followMouse) {
                targetMassPos.set(0,0,0);
            }
        });

        document.getElementById('show-points').addEventListener('change', (e) => {
            spacetimePoints.visible = e.target.checked;
        });

        document.getElementById('reset-particles').addEventListener('click', spawnParticles);

        const bhBtn = document.getElementById('toggle-blackhole');
        bhBtn.addEventListener('click', () => {
            config.isBlackHole = !config.isBlackHole;
            if (config.isBlackHole) {
                bhBtn.innerText = "Deactivate Black Hole";
                massMat.color.setHex(0x000000);
                massMat.emissive.setHex(0x330066); // Dark purple ring
                glowSprite.material.color.setHex(0x8800ff);
                planeMat.color.setHex(0x8800ff);
                config.mass = 3.5; // Boost mass automatically
                document.getElementById('mass-slider').value = 3.5;
                document.getElementById('mass-val').textContent = "3.5";
            } else {
                bhBtn.innerText = "Activate Black Hole Mode";
                massMat.color.setHex(0xffff00);
                massMat.emissive.setHex(0xffaa00);
                glowSprite.material.color.setHex(0xffaa00);
                planeMat.color.setHex(0x00d2ff);
                config.mass = 1.5;
                document.getElementById('mass-slider').value = 1.5;
                document.getElementById('mass-val').textContent = "1.5";
            }
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();

    </script>
</body>
</html>
